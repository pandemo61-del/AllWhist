name: Android Production Build

on:
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    env:
      APP_MODULE: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo dependencies
        run: npx expo install --check

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Decode google-services.json
        run: |
          mkdir -p android/app
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Decode keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      - name: Validate production keystore
        run: |
          FINGERPRINT=$(keytool -list -v \
            -keystore android/app/keystore.jks \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            | grep "SHA256:" \
            | head -1 \
            | sed 's/.*SHA256: //' \
            | tr -d ' ')

          EXPECTED=$(echo "${{ secrets.KEYSTORE_SHA256 }}" | tr -d ' ')

          echo "Expected fingerprint: $EXPECTED"
          echo "Actual fingerprint  : $FINGERPRINT"

          if [ "$FINGERPRINT" != "$EXPECTED" ]; then
            echo "ERROR: Wrong production keystore"
            exit 1
          fi

      - name: Create signing properties
        run: |
          cat > android/keystore.properties <<EOF
          MYAPP_RELEASE_STORE_FILE=keystore.jks
          MYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Verify signing config exists
        run: |
          grep -q "signingConfigs.release" android/app/build.gradle

      - name: Clean Android
        working-directory: android
        run: ./gradlew clean

      - name: Build Production AAB
        working-directory: android
        env:
          MYAPP_RELEASE_STORE_FILE: keystore.jks
          MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify AAB generated
        run: |
          test -f android/app/build/outputs/bundle/release/app-release.aab

      - name: Verify AAB signature
        run: |
          jarsigner -verify \
            -verbose \
            -certs \
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Display signing certificate
        run: |
          keytool -list -v \
            -keystore android/app/keystore.jks \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            | grep -E "SHA1:|SHA256:"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: allwhist-production-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Publish Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.allwhist.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed