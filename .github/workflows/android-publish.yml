name: Android Production Build

on:
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    env:
      APP_MODULE: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo dependencies
        run: npx expo install --check

      - name: Decode keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      - name: Validate keystore fingerprint
        run: |
          FINGERPRINT=$(keytool -list -v \
            -keystore android/app/keystore.jks \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            | grep "SHA256:" \
            | head -1 \
            | sed 's/.*SHA256: //' \
            | tr -d ' ')

          echo "Fingerprint: $FINGERPRINT"

          if [ "$FINGERPRINT" != "${{ secrets.EXPECTED_SHA256 }}" ]; then
            echo "Wrong keystore detected"
            exit 1
          fi

      - name: Create signing properties
        run: |
          cat <<EOF > android/keystore.properties
          storeFile=keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Verify signing config exists
        run: |
          grep -q "signingConfigs.release" android/app/build.gradle

      - name: Clean Android
        run: |
          cd android
          ./gradlew clean

      - name: Build production AAB
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Verify AAB generated
        run: |
          test -f android/app/build/outputs/bundle/release/app-release.aab

      - name: Validate final signature
        run: |
          jarsigner -verify \
            -verbose \
            -certs \
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: allwhist-production-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Publish Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: com.allwhist.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed