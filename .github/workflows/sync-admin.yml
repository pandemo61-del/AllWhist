name: Sync Admin to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'admin/**'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy admin as allwhist root
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.PAGES_TOKEN }}
          repository-name: pandemo61-del/pandemo61-del.github.io
          branch: main
          folder: admin
          target-folder: allwhist
          clean: true
