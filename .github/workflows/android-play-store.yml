name: Build and publish Android with Expo EAS

on:
  workflow_dispatch:
    inputs:
      submit_to_play_store:
        description: "Submit the build to Google Play internal track"
        required: true
        type: boolean
        default: true

  push:
    branches:
      - main
    paths:
      - "app.json"
      - "app.config.js"
      - "app.config.ts"
      - "eas.json"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "assets/**"
      - ".github/workflows/android-play-store.yml"

concurrency:
  group: android-production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  EAS_NO_VCS: "1"
  CI: "1"

jobs:
  validate:
    name: Validate Expo project
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Run Expo Doctor
        run: npx expo-doctor

      - name: Verify Android package
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_NAME="$(node -e "
            const { getConfig } = require('@expo/config');
            const config = getConfig(process.cwd());
            process.stdout.write(config.exp.android?.package || '');
          ")"

          if [ -z "${PACKAGE_NAME}" ]; then
            echo "::error::No Android package is configured in the Expo configuration."
            exit 1
          fi

          if [ "${PACKAGE_NAME}" != "com.allwhist.app" ]; then
            echo "::error::Unexpected Android package: ${PACKAGE_NAME}"
            echo "::error::Expected: com.allwhist.app"
            exit 1
          fi

          echo "Android package verified: ${PACKAGE_NAME}"

  build:
    name: Build signed Android App Bundle
    needs:
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      build_id: ${{ steps.build.outputs.build_id }}
      build_url: ${{ steps.build.outputs.build_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify Expo authentication
        run: eas whoami

      - name: Start signed EAS production build
        id: build
        shell: bash
        run: |
          set -euo pipefail

          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --no-wait \
            --json > eas-build.json

          cat eas-build.json

          BUILD_ID="$(node -e "
            const fs = require('fs');
            const builds = JSON.parse(fs.readFileSync('eas-build.json', 'utf8'));
            const build = Array.isArray(builds) ? builds[0] : builds;

            if (!build || !build.id) {
              process.exit(1);
            }

            process.stdout.write(build.id);
          ")"

          BUILD_URL="$(node -e "
            const fs = require('fs');
            const builds = JSON.parse(fs.readFileSync('eas-build.json', 'utf8'));
            const build = Array.isArray(builds) ? builds[0] : builds;

            process.stdout.write(
              build?.buildDetailsPageUrl ||
              build?.url ||
              ''
            );
          ")"

          echo "build_id=${BUILD_ID}" >> "${GITHUB_OUTPUT}"
          echo "build_url=${BUILD_URL}" >> "${GITHUB_OUTPUT}"

          {
            echo "## Expo EAS Android build"
            echo ""
            echo "- Build ID: \`${BUILD_ID}\`"
            echo "- Profile: \`production\`"
            echo "- Package: \`com.allwhist.app\`"
            echo "- Credentials source: Expo remote credentials"
            if [ -n "${BUILD_URL}" ]; then
              echo "- Build page: ${BUILD_URL}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  submit:
    name: Submit build to Google Play
    needs:
      - build
    if: >-
      github.event_name == 'push' ||
      inputs.submit_to_play_store == true
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify build identifier
        shell: bash
        env:
          BUILD_ID: ${{ needs.build.outputs.build_id }}
        run: |
          set -euo pipefail

          if [ -z "${BUILD_ID}" ]; then
            echo "::error::The EAS build identifier is missing."
            exit 1
          fi

          echo "Build selected for submission: ${BUILD_ID}"

      - name: Submit EAS build to Google Play
        shell: bash
        env:
          BUILD_ID: ${{ needs.build.outputs.build_id }}
        run: |
          set -euo pipefail

          eas submit \
            --platform android \
            --profile production \
            --id "${BUILD_ID}" \
            --non-interactive \
            --no-wait

          {
            echo "## Google Play submission"
            echo ""
            echo "- EAS build ID: \`${BUILD_ID}\`"
            echo "- Package: \`com.allwhist.app\`"
            echo "- Track: \`internal\`"
            echo "- Release status: \`completed\`"
          } >> "${GITHUB_STEP_SUMMARY}"
