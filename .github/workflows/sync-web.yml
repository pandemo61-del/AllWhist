name: Sync Web to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Display deployment information
        run: |
          echo "========================================="
          echo "Source      : AllWhist/web"
          echo "Destination : pandemo61-del.github.io/allwhist"
          echo "Commit      : ${{ github.sha }}"
          echo "Actor       : ${{ github.actor }}"
          echo "========================================="

      - name: Deploy web to allwhist
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.PAGES_TOKEN }}
          repository-name: pandemo61-del/pandemo61-del.github.io
          branch: main
          folder: web
          target-folder: allwhist
          clean: false

      - name: Deployment summary
        run: |
          echo "========================================="
          echo "✅ Deployment completed"
          echo "📂 Copied : AllWhist/web"
          echo "📂 To     : pandemo61-del.github.io/allwhist"
          echo "🌐 Site   : https://pandemo61-del.github.io/allwhist/"
          echo "========================================="
