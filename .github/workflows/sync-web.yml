name: Sync AllWhist Web

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          repository: pandemo61-del/pandemo61-del.github.io
          token: ${{ secrets.PAGES_SYNC_TOKEN }}
          path: destination

      - name: Show paths
        run: |
          echo "Source      : AllWhist/web"
          echo "Destination : pandemo61-del.github.io/allwhist/web"

      - name: Create destination folder
        run: |
          mkdir -p destination/allwhist/web

      - name: Synchronize files
        run: |
          rsync -av --delete \
            web/ \
            destination/allwhist/web/

      - name: Commit changes
        run: |
          cd destination

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add allwhist/web

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Sync web from AllWhist"
            git push origin main
          fi
