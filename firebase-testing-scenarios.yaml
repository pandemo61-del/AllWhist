tests:
  - displayName: Anonymous login
    id: auth_001
    steps:
      - goal: Launch the app and sign in anonymously.
        finalScreenAssertion: The user is authenticated and the session is active.

  - displayName: Google login
    id: auth_002
    steps:
      - goal: Sign in with Google using the authentication flow.
        finalScreenAssertion: The user is successfully authenticated and has a valid email address.

  - displayName: Save user settings
    id: firestore_001
    steps:
      - goal: Open the settings screen and save the user preferences in French with notifications enabled.
        finalScreenAssertion: The preferences are persisted successfully and the app confirms the save.

  - displayName: Save completed game
    id: firestore_002
    steps:
      - goal: Complete a game and save the result to the games collection.
        finalScreenAssertion: The game result is stored successfully and the app confirms the creation of the record.

  - displayName: Loaded state after login
    id: sync_001
    steps:
      - goal: Sign in and wait for cloud data to sync into the local app state.
        finalScreenAssertion: The settings and stats are loaded correctly from Firebase and the app is ready to use.

  - displayName: User can read own data
    id: security_001
    steps:
      - goal: Open the private settings for the current user and then try to access another user's private settings.
        finalScreenAssertion: The app allows access to the user's own data and blocks access to another user's private data.

  - displayName: Network failure fallback
    id: error_001
    steps:
      - goal: Simulate a network failure while signing in and continue using the app.
        finalScreenAssertion: The app handles the error gracefully without crashing and shows a safe fallback state.
