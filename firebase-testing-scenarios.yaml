version: 1.2
tests:
  - displayName: Anonymous login
    id: auth_001
    steps:
      - goal: Tap the anonymous login button
        hint: Look for a button labeled "Sign in anonymously" or "Guest login" on the welcome screen
        finalScreenAssertion: The main screen appears with a user profile or game list visible

  - displayName: Google login
    id: auth_002
    prerequisiteTestCaseId: auth_001
    steps:
      - goal: Navigate to the login screen and tap the Google login button
        hint: Look for a button labeled "Sign in with Google" or a Google icon
        finalScreenAssertion: The Google login popup appears or the user is redirected to the home screen with their profile visible

  - displayName: Define username
    id: profile_001
    prerequisiteTestCaseId: auth_001
    steps:
      - goal: Open settings or profile screen and enter a username
        hint: Look for a "Settings", "Profile", or "Edit profile" button; tap it and find a text field for username
        finalScreenAssertion: The username input field displays the text entered and a "Save" button is visible

  - displayName: Save user settings
    id: firestore_001
    prerequisiteTestCaseId: profile_001
    steps:
      - goal: Open the settings menu and scroll to language and audio preferences
        hint: Look for buttons labeled "Settings", "Preferences", or a gear icon
        finalScreenAssertion: Settings screen displays options for language (French), vibration toggle, and sound toggle
      - goal: Set language to French, disable auto-play, and enable vibration and sound
        hint: Tap the language dropdown and select French; toggle vibration and sound switches to ON
        finalScreenAssertion: All settings are updated visually and a confirmation message or "Save" button appears

  - displayName: Save completed game
    id: firestore_002
    prerequisiteTestCaseId: profile_001
    steps:
      - goal: Start and complete a game
        hint: Look for a "Play" or "Start Game" button; play through a complete round
        finalScreenAssertion: A game results screen appears showing scores and a completion confirmation
      - goal: Tap the button to save the game result
        hint: Look for "Save", "Submit", or "Continue" on the results screen
        finalScreenAssertion: The app confirms the game was saved and returns to the main menu

  - displayName: Loaded state after login
    id: sync_001
    prerequisiteTestCaseId: auth_001
    steps:
      - goal: Sign in and wait for data to load
        hint: After login, observe the loading indicator; wait for it to disappear
        finalScreenAssertion: User profile, stats, and game history appear on the home screen without errors

  - displayName: User can read own data
    id: security_001
    prerequisiteTestCaseId: auth_001
    steps:
      - goal: Open the profile screen and view personal settings
        hint: Look for a profile icon or "Profile" button
        finalScreenAssertion: Personal settings are displayed and accessible without errors

  - displayName: Network failure fallback
    id: error_001
    steps:
      - goal: Disconnect the device from internet and try to sign in
        hint: Disable WiFi and mobile data before tapping the login button
        finalScreenAssertion: The app shows an error message (e.g., "Network unavailable") but does not crash and the user can retry

  - displayName: App stability under stress
    id: stress_001
    prerequisiteTestCaseId: auth_001
    steps:
      - goal: Rapidly tap buttons to switch between screens and menus
        hint: Open Settings, close it, open Games, close it, repeat 5 times quickly
        finalScreenAssertion: The app remains responsive and does not crash or show black screens
