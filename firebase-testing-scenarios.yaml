version: 1
name: AllWhist Firebase scenario suite
scenarios:
  - id: auth_001
    name: Anonymous login
    description: "Authenticate as an anonymous user and verify the session is active."
    steps:
      - type: auth
        action: signInAnonymously
      - type: assert
        condition: "user != null"
        message: "Anonymous user must be created successfully."

  - id: auth_002
    name: Google login
    description: "Authenticate with Google and verify the Firebase user is valid."
    steps:
      - type: auth
        action: signInWithPopup
        provider: Google
      - type: assert
        condition: "user.email != null"
        message: "Google-authenticated user must have an email."

  - id: firestore_001
    name: Save user settings
    description: "Persist user preferences into Firestore."
    steps:
      - type: firestore
        collection: users/{uid}/private/settings
        operation: set
        payload:
          langue: fr
          autoJeu: false
          vibration: true
          son: true
      - type: assert
        condition: "writeSucceeded == true"
        message: "The settings document should be saved."

  - id: firestore_002
    name: Save completed game
    description: "Persist a finished game result in the games collection."
    steps:
      - type: firestore
        collection: games
        operation: add
        payload:
          userId: "uid-test-001"
          varianteId: classic
          manche: 1
          scores: [0, 0, 0, 0]
          timestamp: "2026-10-09T00:00:00.000Z"
      - type: assert
        condition: "documentId != null"
        message: "Game record should be created with an ID."

  - id: sync_001
    name: Loaded state after login
    description: "Verify that settings and stats are loaded after authentication."
    steps:
      - type: state
        action: initializeSync
      - type: assert
        condition: "settingsLoaded == true && statsLoaded == true"
        message: "Cloud data should be loaded into local store."

  - id: security_001
    name: User can read own data
    description: "Verify user A cannot read user B private data."
    steps:
      - type: firestore
        collection: users/userA/private/settings
        operation: read
      - type: assert
        condition: "readAllowed == true"
        message: "User can read own data."
      - type: firestore
        collection: users/userB/private/settings
        operation: read
      - type: assert
        condition: "readAllowed == false"
        message: "User cannot read another user's private data."

  - id: error_001
    name: Network failure fallback
    description: "When Firebase is unavailable, the app should fail gracefully."
    steps:
      - type: auth
        action: signInAnonymously
        simulateFailure: network-error
      - type: assert
        condition: "result == null || error.code == 'auth/network-request-failed'"
        message: "The app should handle network errors without crashing."
